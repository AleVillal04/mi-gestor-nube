<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudDeck - Gestor Multinube</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --border: #334155;
      --gdrive: #22c55e;
      --onedrive: #0ea5e9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }

    /* Barra lateral */
    .sidebar {
      width: 280px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 16px; transition: transform 0.25s ease; z-index: 20;
    }
    .logo { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .nav-label { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; letter-spacing: 0.05em; }
    .nav-btn {
      width: 100%; background: transparent; border: none; color: var(--text);
      padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex;
      align-items: center; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; text-align: left;
    }
    .nav-btn:hover, .nav-btn.active { background: var(--panel-hover); }

    .accounts-list { flex: 1; overflow-y: auto; margin-bottom: 12px; }
    .account-row {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
      transition: background 0.15s;
    }
    .account-row:hover, .account-row.active { background: var(--panel-hover); }
    .account-main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .account-texts { min-width: 0; flex: 1; }
    .account-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-status { font-size: 0.7rem; color: var(--muted); }
    .account-status.ok { color: #4ade80; }
    .account-status.expired { color: #fbbf24; }
    .account-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .mini-btn {
      background: transparent; border: none; color: var(--muted); cursor: pointer;
      padding: 4px; border-radius: 4px; font-size: 0.85rem;
    }
    .mini-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .btn-primary {
      background: var(--accent); color: white; border: none; padding: 10px 14px;
      border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%;
    }
    .btn-primary:hover { filter: brightness(1.1); }

    /* Área principal */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 64px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; gap: 10px; padding: 0 16px; background: var(--bg);
    }
    .menu-toggle { display: none; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .search-box {
      flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
      padding: 9px 14px; border-radius: 8px; outline: none; font-size: 0.95rem; min-width: 0;
    }
    .icon-btn {
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 0.88rem;
    }
    .icon-btn.upload { background: #16a34a; border-color: #15803d; font-weight: 600; }

    .toolbar { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .breadcrumb { font-size: 0.9rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .breadcrumb strong { color: var(--text); }
    .back-btn {
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.82rem;
    }

    /* Archivos */
    .files-container { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; }
    .files-list { display: flex; flex-direction: column; gap: 8px; }

    .file-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; cursor: pointer; transition: border-color 0.15s, transform 0.1s;
      display: flex; flex-direction: column; gap: 8px;
    }
    .file-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .files-list .file-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 14px; }

    .file-icon { font-size: 2rem; }
    .files-list .file-icon { font-size: 1.4rem; margin-right: 10px; }
    .file-info { min-width: 0; flex: 1; }
    .file-name { font-weight: 500; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .cloud-tag {
      font-size: 0.68rem; padding: 2px 7px; border-radius: 6px; font-weight: 600; align-self: flex-start;
      background: rgba(255,255,255,0.07);
    }
    .empty-msg { color: var(--muted); font-size: 0.92rem; padding: 20px 0; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none;
      align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      width: 100%; max-width: 440px; padding: 20px; max-height: 90dvh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 10px; }
    .modal p { font-size: 0.86rem; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
    .provider-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; background: var(--bg); border-radius: 8px; margin-bottom: 8px;
    }
    .btn-sm { padding: 7px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; background: var(--accent); color: #fff; }

    .settings-toggle-btn {
      width: 100%; background: transparent; border: 1px dashed var(--border); color: var(--muted);
      padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .settings-toggle-btn:hover { color: var(--text); border-color: var(--muted); }
    .settings-panel {
      display: none; margin-top: 12px; padding: 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
    }
    .settings-panel.open { display: block; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
    .input-group input {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 0.84rem;
    }
    .settings-feedback { font-size: 0.78rem; color: #4ade80; margin-top: 8px; min-height: 18px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 15; }

    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .overlay.open { display: block; }
      .menu-toggle { display: inline-block; }
      .files-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); }
    }
  </style>
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo">☁️ CloudDeck</div>

    <button class="nav-btn active" id="allCloudsBtn" onclick="selectAllClouds()">
      <span>📁 Todas las nubes</span>
    </button>

    <div class="nav-label">Tus Cuentas Guardadas</div>
    <div class="accounts-list" id="accountsList"></div>

    <button class="btn-primary" onclick="openConnectModal()">+ Agregar Cuenta</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar(true)">☰</button>
      <input type="search" class="search-box" id="searchInput" placeholder="Buscar archivos..." oninput="renderFiles()" />
      <input type="file" id="uploadInput" hidden onchange="handleFileUpload(event)" />
      <button class="icon-btn upload" onclick="triggerUpload()">⬆ Subir</button>
      <button class="icon-btn" id="viewBtn" onclick="toggleView()">☰ Lista</button>
    </header>

    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb">
        Ubicación: <strong>Todas las cuentas</strong>
      </div>
      <div style="font-size: 0.85rem; color: var(--muted);" id="countLabel">0 elementos</div>
    </div>

    <section class="files-container">
      <div class="files-grid" id="filesList"></div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="connectModal">
    <div class="modal">
      <h3>Agregar Cuenta de Nube</h3>
      <p>Las cuentas que agregues quedarán guardadas en este navegador para entrar con un clic.</p>

      <div class="provider-row">
        <span>🟢 Google Drive</span>
        <button class="btn-sm" onclick="connectGoogleDrive()">Iniciar sesión</button>
      </div>

      <div class="provider-row">
        <span>🔵 OneDrive (Microsoft)</span>
        <button class="btn-sm" onclick="connectOneDrive()">Iniciar sesión</button>
      </div>

      <button class="settings-toggle-btn" onclick="toggleCloudSettings()">
        ⚙️ Ver ajustes de las nubes
      </button>

      <div class="settings-panel" id="cloudSettingsPanel">
        <div class="input-group">
          <label for="googleClientIdInput">Google Client ID:</label>
          <input type="text" id="googleClientIdInput" placeholder="Pega aquí tu Client ID de Google..." />
        </div>
        <div class="input-group">
          <label for="onedriveClientIdInput">OneDrive Application (Client) ID:</label>
          <input type="text" id="onedriveClientIdInput" placeholder="Pega aquí tu ID de aplicación de Microsoft..." />
        </div>
        <button class="btn-sm" style="width:100%;" onclick="saveCloudSettings()">💾 Guardar ajustes</button>
        <div class="settings-feedback" id="settingsFeedback"></div>
      </div>

      <button class="btn-primary" style="margin-top: 14px; background: #475569;" onclick="closeConnectModal()">Cerrar</button>
    </div>
  </div>

  <script>
    const EXT_CONFIG = window.CLOUD_CONFIG || {};
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const MS_AUTH_BASE = "https://login.microsoftonline.com/consumers/oauth2/v2.0";

    let isGridView = true;
    let activeAccountId = "all";
    let savedAccounts = [];
    let allFiles = [];

    function getGoogleClientId() {
      const fromInput = document.getElementById("googleClientIdInput").value.trim();
      const fromStorage = localStorage.getItem("clouddeck_gdrive_id") || "";
      const fromConfig = (EXT_CONFIG.googleClientId || "").trim();
      return fromInput || fromStorage || fromConfig;
    }

    function getOneDriveClientId() {
      const fromInput = document.getElementById("onedriveClientIdInput").value.trim();
      const fromStorage = localStorage.getItem("clouddeck_onedrive_id") || "";
      const fromConfig = (EXT_CONFIG.onedriveClientId || "").trim();
      return fromInput || fromStorage || fromConfig;
    }

    async function initApp() {
      document.getElementById("googleClientIdInput").value =
        localStorage.getItem("clouddeck_gdrive_id") || EXT_CONFIG.googleClientId || "";
      document.getElementById("onedriveClientIdInput").value =
        localStorage.getItem("clouddeck_onedrive_id") || EXT_CONFIG.onedriveClientId || "";

      try {
        savedAccounts = JSON.parse(localStorage.getItem("clouddeck_accounts") || "[]");
      } catch {
        savedAccounts = [];
      }

      await handleMicrosoftRedirectIfAny();

      renderSidebarAccounts();

      for (const acc of savedAccounts) {
        if (acc.provider === "gdrive" && isTokenValid(acc)) {
          loadGoogleDriveFolder(acc, getCurrentFolderId(acc));
        } else if (acc.provider === "onedrive" && (isTokenValid(acc) || acc.refreshToken)) {
          loadOneDriveFolder(acc, getCurrentFolderId(acc));
        }
      }
      renderFiles();
    }

    function toggleCloudSettings(forceOpen) {
      const panel = document.getElementById("cloudSettingsPanel");
      if (typeof forceOpen === "boolean") panel.classList.toggle("open", forceOpen);
      else panel.classList.toggle("open");
      document.getElementById("settingsFeedback").textContent = "";
    }

    function saveCloudSettings() {
      const gId = document.getElementById("googleClientIdInput").value.trim();
      const oId = document.getElementById("onedriveClientIdInput").value.trim();
      localStorage.setItem("clouddeck_gdrive_id", gId);
      localStorage.setItem("clouddeck_onedrive_id", oId);
      document.getElementById("settingsFeedback").textContent = "✅ Ajustes guardados en este navegador.";
    }

    function saveAccountsToStorage() {
      localStorage.setItem("clouddeck_accounts", JSON.stringify(savedAccounts));
    }

    function isTokenValid(acc) {
      return acc.token && acc.expiresAt && Date.now() < acc.expiresAt;
    }

    function getCurrentFolderId(acc) {
      if (!acc.folderStack || acc.folderStack.length === 0) {
        acc.folderStack = [{ id: "root", name: acc.alias }];
      }
      return acc.folderStack[acc.folderStack.length - 1].id;
    }

    function renderSidebarAccounts() {
      const container = document.getElementById("accountsList");
      container.textContent = "";

      document.getElementById("allCloudsBtn").classList.toggle("active", activeAccountId === "all");

      if (savedAccounts.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "font-size:0.82rem; color:var(--muted); padding:6px 10px;";
        empty.textContent = "Aún no guardaste cuentas. Pulsa '+ Agregar Cuenta'.";
        container.appendChild(empty);
        return;
      }

      savedAccounts.forEach(acc => {
        const row = document.createElement("div");
        row.className = "account-row" + (activeAccountId === acc.id ? " active" : "");

        const main = document.createElement("div");
        main.className = "account-main";
        main.onclick = () => selectAccount(acc.id);

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = acc.provider === "gdrive" ? "var(--gdrive)" : "var(--onedrive)";

        const texts = document.createElement("div");
        texts.className = "account-texts";

        const name = document.createElement("div");
        name.className = "account-name";
        name.textContent = acc.alias;
        name.title = acc.email;

        const status = document.createElement("div");
        const valid = isTokenValid(acc) || (acc.provider === "onedrive" && !!acc.refreshToken);
        status.className = "account-status " + (valid ? "ok" : "expired");
        status.textContent = valid ? "Sesión activa" : "Clic para renovar";

        texts.append(name, status);
        main.append(dot, texts);

        const actions = document.createElement("div");
        actions.className = "account-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "mini-btn";
        editBtn.textContent = "✏️";
        editBtn.title = "Cambiar nombre";
        editBtn.onclick = (e) => { e.stopPropagation(); renameAccount(acc.id); };

        const delBtn = document.createElement("button");
        delBtn.className = "mini-btn";
        delBtn.textContent = "🗑️";
        delBtn.title = "Quitar cuenta";
        delBtn.onclick = (e) => { e.stopPropagation(); removeAccount(acc.id); };

        actions.append(editBtn, delBtn);
        row.append(main, actions);
        container.appendChild(row);
      });
    }

    function selectAllClouds() {
      activeAccountId = "all";
      renderSidebarAccounts();
      toggleSidebar(false);
      renderFiles();
    }

    function selectAccount(accountId) {
      const acc = savedAccounts.find(a => a.id === accountId);
      if (!acc) return;

      activeAccountId = accountId;
      renderSidebarAccounts();
      toggleSidebar(false);

      if (acc.provider === "gdrive") {
        if (!isTokenValid(acc)) connectGoogleDrive(acc.email);
        else loadGoogleDriveFolder(acc, getCurrentFolderId(acc));
      } else if (acc.provider === "onedrive") {
        loadOneDriveFolder(acc, getCurrentFolderId(acc));
      }
    }

    function renameAccount(accountId) {
      const acc = savedAccounts.find(a => a.id === accountId);
      if (!acc) return;
      const newName = prompt("Escribe un nuevo nombre para esta cuenta:", acc.alias);
      if (newName && newName.trim() !== "") {
        acc.alias = newName.trim();
        if (acc.folderStack && acc.folderStack.length > 0) acc.folderStack[0].name = acc.alias;
        allFiles.forEach(f => { if (f.accountId === acc.id) f.cloudLabel = acc.alias; });
        saveAccountsToStorage();
        renderSidebarAccounts();
        renderFiles();
      }
    }

    function removeAccount(accountId) {
      const acc = savedAccounts.find(a => a.id === accountId);
      if (!acc) return;
      if (!confirm(`¿Quitar la cuenta "${acc.alias}" de este navegador?`)) return;

      savedAccounts = savedAccounts.filter(a => a.id !== accountId);
      allFiles = allFiles.filter(f => f.accountId !== accountId);
      if (activeAccountId === accountId) activeAccountId = "all";

      saveAccountsToStorage();
      renderSidebarAccounts();
      renderFiles();
    }

    // ==========================================
    // GOOGLE DRIVE
    // ==========================================
    function connectGoogleDrive(hintEmail = "") {
      const clientId = getGoogleClientId();
      if (!clientId) {
        openConnectModal();
        toggleCloudSettings(true);
        document.getElementById("googleClientIdInput").focus();
        document.getElementById("settingsFeedback").textContent = "⚠️ Pega tu Google Client ID aquí y pulsa Guardar.";
        return;
      }
      localStorage.setItem("clouddeck_gdrive_id", clientId);

      const client = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/drive",
        callback: async (tokenResponse) => {
          if (tokenResponse.error || !tokenResponse.access_token) return;
          const token = tokenResponse.access_token;
          const expiresAt = Date.now() + (Number(tokenResponse.expires_in || 3500) - 60) * 1000;

          const aboutRes = await fetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const aboutData = await aboutRes.json();
          const email = aboutData.user?.emailAddress || hintEmail || "Cuenta Google";
          const accId = "gdrive_" + email;

          let existing = savedAccounts.find(a => a.id === accId);
          if (existing) {
            existing.token = token;
            existing.expiresAt = expiresAt;
          } else {
            existing = {
              id: accId, provider: "gdrive", email, alias: email,
              token, expiresAt, folderStack: [{ id: "root", name: email }]
            };
            savedAccounts.push(existing);
          }

          activeAccountId = existing.id;
          saveAccountsToStorage();
          renderSidebarAccounts();
          closeConnectModal();
          await loadGoogleDriveFolder(existing, getCurrentFolderId(existing));
        }
      });

      if (hintEmail) client.requestAccessToken({ hint: hintEmail });
      else client.requestAccessToken({ prompt: "select_account" });
    }

    async function loadGoogleDriveFolder(acc, folderId) {
      const q = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}&pageSize=50&orderBy=folder,name&fields=files(id,name,mimeType,size,modifiedTime,webViewLink)`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${acc.token}` } });
      const data = await res.json();

      if (data.error) {
        if (res.status === 401) {
          acc.expiresAt = 0;
          saveAccountsToStorage();
          renderSidebarAccounts();
        } else {
          alert("Error de Google Drive: " + data.error.message);
        }
        return;
      }

      allFiles = allFiles.filter(f => f.accountId !== acc.id);
      const mapped = (data.files || []).map(f => {
        let type = "file";
        if (f.mimeType.includes("folder")) type = "folder";
        else if (f.mimeType.includes("pdf")) type = "pdf";
        else if (f.mimeType.includes("spreadsheet") || f.mimeType.includes("excel")) type = "sheet";
        else if (f.mimeType.includes("image")) type = "image";

        return {
          id: f.id, accountId: acc.id, provider: "gdrive", name: f.name, type,
          size: f.size ? `${(f.size / 1024 / 1024).toFixed(2)} MB` : "—",
          cloudLabel: acc.alias,
          date: new Date(f.modifiedTime).toLocaleDateString(),
          webViewLink: f.webViewLink
        };
      });

      allFiles = [...allFiles, ...mapped];
      renderFiles();
    }

    // ==========================================
    // ONEDRIVE (Cuentas Personales Microsoft)
    // ==========================================
    function generateRandomString(len = 64) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, x => chars[x % chars.length]).join("");
    }

    async function sha256Base64Url(plain) {
      const data = new TextEncoder().encode(plain);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return btoa(String.fromCharCode(...new Uint8Array(hash)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    async function connectOneDrive() {
      const clientId = getOneDriveClientId();
      if (!clientId) {
        openConnectModal();
        toggleCloudSettings(true);
        document.getElementById("onedriveClientIdInput").focus();
        document.getElementById("settingsFeedback").textContent = "⚠️ Pega tu OneDrive Client ID aquí y pulsa Guardar.";
        return;
      }
      localStorage.setItem("clouddeck_onedrive_id", clientId);

      const verifier = generateRandomString(64);
      const challenge = await sha256Base64Url(verifier);
      const state = generateRandomString(24);

      localStorage.setItem("clouddeck_ms_pkce", JSON.stringify({ verifier, state, clientId }));

      const params = new URLSearchParams({
        client_id: clientId,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        response_mode: "query",
        scope: "User.Read Files.ReadWrite offline_access",
        code_challenge: challenge,
        code_challenge_method: "S256",
        state: state,
        prompt: "select_account"
      });

      window.location.href = `${MS_AUTH_BASE}/authorize?${params.toString()}`;
    }

    async function handleMicrosoftRedirectIfAny() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const err = params.get("error");

      if (err) {
        const desc = params.get("error_description") || err;
        window.history.replaceState({}, document.title, window.location.pathname);
        alert("No se pudo conectar OneDrive: " + desc);
        return;
      }

      if (!code || !state) return;

      const savedPkce = JSON.parse(localStorage.getItem("clouddeck_ms_pkce") || "null");
      localStorage.removeItem("clouddeck_ms_pkce");
      window.history.replaceState({}, document.title, window.location.pathname);

      if (!savedPkce || savedPkce.state !== state) return;

      const body = new URLSearchParams({
        client_id: savedPkce.clientId,
        scope: "User.Read Files.ReadWrite offline_access",
        code: code,
        redirect_uri: REDIRECT_URI,
        grant_type: "authorization_code",
        code_verifier: savedPkce.verifier
      });

      const tokenRes = await fetch(`${MS_AUTH_BASE}/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString()
      });
      const tokenData = await tokenRes.json();

      if (tokenData.error || !tokenData.access_token) {
        alert("Error obteniendo sesión de OneDrive: " + (tokenData.error_description || tokenData.error));
        return;
      }

      const token = tokenData.access_token;
      const expiresAt = Date.now() + (Number(tokenData.expires_in || 3500) - 60) * 1000;

      const meRes = await fetch("https://graph.microsoft.com/v1.0/me", {
        headers: { Authorization: `Bearer ${token}` }
      });
      const me = await meRes.json();
      const email = me.mail || me.userPrincipalName || me.displayName || "Cuenta OneDrive";
      const accId = "onedrive_" + email;

      let existing = savedAccounts.find(a => a.id === accId);
      if (existing) {
        existing.token = token;
        existing.refreshToken = tokenData.refresh_token || existing.refreshToken;
        existing.expiresAt = expiresAt;
      } else {
        existing = {
          id: accId,
          provider: "onedrive",
          email,
          alias: email,
          token,
          refreshToken: tokenData.refresh_token || "",
          expiresAt,
          folderStack: [{ id: "root", name: email }]
        };
        savedAccounts.push(existing);
      }

      activeAccountId = existing.id;
      saveAccountsToStorage();
    }

    async function ensureOneDriveToken(acc) {
      if (isTokenValid(acc)) return acc.token;
      const clientId = getOneDriveClientId();
      if (!acc.refreshToken || !clientId) return null;

      const body = new URLSearchParams({
        client_id: clientId,
        scope: "User.Read Files.ReadWrite offline_access",
        refresh_token: acc.refreshToken,
        grant_type: "refresh_token"
      });

      const res = await fetch(`${MS_AUTH_BASE}/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString()
      });
      const data = await res.json();

      if (data.access_token) {
        acc.token = data.access_token;
        if (data.refresh_token) acc.refreshToken = data.refresh_token;
        acc.expiresAt = Date.now() + (Number(data.expires_in || 3500) - 60) * 1000;
        saveAccountsToStorage();
        renderSidebarAccounts();
        return acc.token;
      } else {
        acc.refreshToken = "";
        acc.expiresAt = 0;
        saveAccountsToStorage();
        renderSidebarAccounts();
        return null;
      }
    }

    async function loadOneDriveFolder(acc, folderId) {
      const token = await ensureOneDriveToken(acc);
      if (!token) {
        connectOneDrive();
        return;
      }

      const url = folderId === "root"
        ? "https://graph.microsoft.com/v1.0/me/drive/root/children?$top=50"
        : `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children?$top=50`;

      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();

      if (data.error) {
        alert("Error de OneDrive: " + data.error.message);
        return;
      }

      allFiles = allFiles.filter(f => f.accountId !== acc.id);
      const mapped = (data.value || []).map(item => {
        let type = "file";
        const mime = item.file?.mimeType || "";
        const lowerName = item.name.toLowerCase();
        if (item.folder) type = "folder";
        else if (mime.includes("pdf") || lowerName.endsWith(".pdf")) type = "pdf";
        else if (mime.includes("spreadsheet") || lowerName.endsWith(".xlsx") || lowerName.endsWith(".csv")) type = "sheet";
        else if (mime.includes("image")) type = "image";

        return {
          id: item.id,
          accountId: acc.id,
          provider: "onedrive",
          name: item.name,
          type,
          size: item.size ? `${(item.size / 1024 / 1024).toFixed(2)} MB` : "—",
          cloudLabel: acc.alias,
          date: new Date(item.lastModifiedDateTime).toLocaleDateString(),
          webViewLink: item.webUrl
        };
      });

      mapped.sort((a, b) => (a.type === "folder" ? -1 : 1) - (b.type === "folder" ? -1 : 1));
      allFiles = [...allFiles, ...mapped];
      renderFiles();
    }

    // ==========================================
    // INTERFAZ COMÚN Y SUBIDA DE ARCHIVOS
    // ==========================================
    function getIcon(type) {
      const icons = { folder: "📁", pdf: "📕", sheet: "📊", image: "🖼️", file: "📄" };
      return icons[type] || "📄";
    }

    function renderFiles() {
      const container = document.getElementById("filesList");
      const query = document.getElementById("searchInput").value.toLowerCase();
      container.className = isGridView ? "files-grid" : "files-list";
      container.textContent = "";

      const filtered = allFiles.filter(f => {
        const matchesAcc = activeAccountId === "all" || f.accountId === activeAccountId;
        const matchesQuery = f.name.toLowerCase().includes(query);
        return matchesAcc && matchesQuery;
      });

      document.getElementById("countLabel").textContent = `${filtered.length} elementos`;
      updateBreadcrumb();

      if (filtered.length === 0) {
        const msg = document.createElement("div");
        msg.className = "empty-msg";
        msg.textContent = savedAccounts.length === 0
          ? "Pulsa '+ Agregar Cuenta' en el menú izquierdo para conectar Google Drive o OneDrive."
          : "No hay archivos para mostrar aquí (si la sesión expiró, haz clic en tu cuenta a la izquierda).";
        container.appendChild(msg);
        return;
      }

      filtered.forEach(file => {
        const card = document.createElement("div");
        card.className = "file-card";
        card.onclick = () => handleFileClick(file);

        const icon = document.createElement("div");
        icon.className = "file-icon";
        icon.textContent = getIcon(file.type);

        const info = document.createElement("div");
        info.className = "file-info";

        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = file.name;

        const meta = document.createElement("div");
        meta.className = "file-meta";
        meta.textContent = `${file.size} • ${file.date}`;

        info.append(name, meta);

        const tag = document.createElement("span");
        tag.className = "cloud-tag";
        tag.textContent = file.cloudLabel;

        card.append(icon, info, tag);
        container.appendChild(card);
      });
    }

    function updateBreadcrumb() {
      const bc = document.getElementById("breadcrumb");
      bc.textContent = "";

      if (activeAccountId !== "all") {
        const acc = savedAccounts.find(a => a.id === activeAccountId);
        if (acc) {
          if (acc.folderStack && acc.folderStack.length > 1) {
            const back = document.createElement("button");
            back.className = "back-btn";
            back.textContent = "⬅ Atrás";
            back.onclick = () => goBackFolder(acc);
            bc.appendChild(back);
          }
          const strong = document.createElement("strong");
          strong.textContent = (acc.folderStack || [{ name: acc.alias }]).map(s => s.name).join(" / ");
          bc.appendChild(strong);
          return;
        }
      }
      const label = document.createTextNode("Ubicación: ");
      const strong = document.createElement("strong");
      strong.textContent = "Todas las cuentas";
      bc.append(label, strong);
    }

    function handleFileClick(file) {
      const acc = savedAccounts.find(a => a.id === file.accountId);
      if (!acc) return;

      if (file.type === "folder") {
        activeAccountId = acc.id;
        if (!acc.folderStack) acc.folderStack = [{ id: "root", name: acc.alias }];
        acc.folderStack.push({ id: file.id, name: file.name });
        saveAccountsToStorage();
        renderSidebarAccounts();

        if (acc.provider === "gdrive") {
          if (!isTokenValid(acc)) connectGoogleDrive(acc.email);
          else loadGoogleDriveFolder(acc, file.id);
        } else {
          loadOneDriveFolder(acc, file.id);
        }
      } else if (file.webViewLink) {
        window.open(file.webViewLink, "_blank", "noopener");
      }
    }

    function goBackFolder(acc) {
      if (acc.folderStack && acc.folderStack.length > 1) {
        acc.folderStack.pop();
        saveAccountsToStorage();
        const folderId = getCurrentFolderId(acc);
        if (acc.provider === "gdrive") loadGoogleDriveFolder(acc, folderId);
        else loadOneDriveFolder(acc, folderId);
      }
    }

    function getTargetActiveAccount() {
      const isAccReady = a => isTokenValid(a) || (a.provider === "onedrive" && !!a.refreshToken);
      return activeAccountId === "all"
        ? savedAccounts.find(isAccReady)
        : savedAccounts.find(a => a.id === activeAccountId && isAccReady(a));
    }

    function triggerUpload() {
      if (!getTargetActiveAccount()) {
        alert("Primero selecciona o inicia sesión en una cuenta activa para subir archivos.");
        return;
      }
      document.getElementById("uploadInput").click();
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      const targetAcc = getTargetActiveAccount();
      if (!file || !targetAcc) return;

      const currentFolder = getCurrentFolderId(targetAcc);

      if (targetAcc.provider === "gdrive") {
        const metadata = { name: file.name, parents: [currentFolder] };
        const form = new FormData();
        form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
        form.append("file", file);

        const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
          method: "POST",
          headers: { Authorization: `Bearer ${targetAcc.token}` },
          body: form
        });

        if (res.ok) {
          alert(`✅ "${file.name}" subido a "${targetAcc.alias}".`);
          loadGoogleDriveFolder(targetAcc, currentFolder);
        } else {
          alert("Hubo un error al subir a Google Drive.");
        }
      } else if (targetAcc.provider === "onedrive") {
        const token = await ensureOneDriveToken(targetAcc);
        if (!token) { connectOneDrive(); return; }

        if (file.size <= 4 * 1024 * 1024) {
          const path = currentFolder === "root"
            ? `https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURIComponent(file.name)}:/content`
            : `https://graph.microsoft.com/v1.0/me/drive/items/${currentFolder}:/${encodeURIComponent(file.name)}:/content`;

          const res = await fetch(path, {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}` },
            body: file
          });

          if (res.ok) {
            alert(`✅ "${file.name}" subido a "${targetAcc.alias}".`);
            loadOneDriveFolder(targetAcc, currentFolder);
          } else {
            alert("Hubo un error al subir a OneDrive.");
          }
        } else {
          const sessionUrl = currentFolder === "root"
            ? `https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURIComponent(file.name)}:/createUploadSession`
            : `https://graph.microsoft.com/v1.0/me/drive/items/${currentFolder}:/${encodeURIComponent(file.name)}:/createUploadSession`;

          const sessionRes = await fetch(sessionUrl, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ item: { "@microsoft.graph.conflictBehavior": "rename", name: file.name } })
          });
          const sessionData = await sessionRes.json();
          if (!sessionData.uploadUrl) {
            alert("No se pudo iniciar la subida grande en OneDrive.");
            return;
          }

          const chunkSize = 5 * 1024 * 1024;
          let start = 0;
          while (start < file.size) {
            const end = Math.min(start + chunkSize, file.size);
            const slice = file.slice(start, end);
            const chunkRes = await fetch(sessionData.uploadUrl, {
              method: "PUT",
              headers: { "Content-Range": `bytes ${start}-${end - 1}/${file.size}` },
              body: slice
            });
            if (!chunkRes.ok) {
              alert("Error durante la subida del archivo a OneDrive.");
              return;
            }
            start = end;
          }
          alert(`✅ "${file.name}" subido a "${targetAcc.alias}".`);
          loadOneDriveFolder(targetAcc, currentFolder);
        }
      }
      event.target.value = "";
    }

    function toggleView() {
      isGridView = !isGridView;
      document.getElementById("viewBtn").textContent = isGridView ? "☰ Lista" : "⊞ Cuadrícula";
      renderFiles();
    }

    function toggleSidebar(open) {
      document.getElementById("sidebar").classList.toggle("open", open);
      document.getElementById("overlay").classList.toggle("open", open);
    }

    function openConnectModal() {
      document.getElementById("cloudSettingsPanel").classList.remove("open");
      document.getElementById("settingsFeedback").textContent = "";
      document.getElementById("connectModal").classList.add("open");
    }
    function closeConnectModal() { document.getElementById("connectModal").classList.remove("open"); }

    initApp();
  </script>
</body>
